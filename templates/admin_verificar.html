<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar Cierres - Librería Rosita</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: #f0f2f5; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { color: #333; margin-bottom: 20px; font-size: 24px; }
        a.volver { color: #0070c0; text-decoration: none; font-weight: bold; font-size: 14px; display: inline-block; margin-bottom: 16px; }
        .card { background: white; padding: 24px; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin-bottom: 20px; }
        .cierre { padding: 20px; background: #fff8e1; border-left: 5px solid #f57c00; border-radius: 10px; margin-bottom: 16px; cursor: pointer; }
        .cierre:hover { background: #ffecb3; }
        .cierre-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .cierre-detalle { color: #666; font-size: 14px; }
        .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 100; }
        .modal-bg.activo { display: flex; }
        .modal { background: white; padding: 28px; border-radius: 14px; max-width: 500px; width: 100%; }
        .modal h3 { margin-bottom: 16px; color: #333; }
        .modal .row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
        .modal input[type="number"], .modal input[type="text"] { width: 100%; padding: 14px; font-size: 16px; border: 2px solid #e0e0e0; border-radius: 10px; margin-bottom: 12px; margin-top: 12px; }
        .modal button { padding: 14px 24px; font-size: 16px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; width: 100%; margin-top: 8px; }
        .btn-primary { background: #0070c0; color: white; }
        .btn-secondary { background: #eee; color: #333; }
        .sin-pendientes { padding: 30px; text-align: center; color: #888; }
        .badge-dif { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .badge-dif.ok { background: #c8e6c9; color: #1b5e20; }
        .badge-dif.bad { background: #ffcdd2; color: #b71c1c; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="volver">← Volver al panel</a>
        <h1>🔍 Verificar cierres pendientes</h1>

        <div class="card">
            <div id="lista"><div class="sin-pendientes">Cargando...</div></div>
        </div>
    </div>

    <div class="modal-bg" id="modal">
        <div class="modal">
            <h3>Verificar cierre</h3>
            <div id="modal-info"></div>
            <p style="margin-top:16px; color:#666; font-size:14px;">Ingresa el efectivo que TÚ contaste físicamente:</p>
            <input type="number" id="conteo_admin" placeholder="Tu conteo (S/)" step="0.01" min="0">
            <input type="text" id="obs_admin" placeholder="Observaciones (opcional)">
            <button class="btn-primary" onclick="confirmarVerificacion()">Confirmar verificación</button>
            <button class="btn-secondary" onclick="cerrarModal()">Cancelar</button>
        </div>
    </div>

    <script>
        let cajaActual = null;

        function cargarPendientes() {
            fetch('/api/admin/cierres-pendientes').then(r => r.json()).then(data => {
                const lista = document.getElementById('lista');
                if (!data.length) {
                    lista.innerHTML = '<div class="sin-pendientes">✅ No hay cierres pendientes de verificar.</div>';
                    return;
                }
                lista.innerHTML = data.map(c => {
                    const fecha = new Date(c.fecha).toLocaleDateString('es-PE');
                    return '<div class="cierre" onclick="abrirModal(' + c.id + ')">' +
                        '<div class="cierre-header">' +
                        '<b>' + (c.tiendas?.nombre || 'Tienda') + ' — ' + fecha + '</b>' +
                        '<span class="badge-dif ' + (Math.abs(c.diferencia_vendedora || 0) < 0.01 ? 'ok' : 'bad') + '">' +
                        (Math.abs(c.diferencia_vendedora || 0) < 0.01 ? 'Cuadra' : 'Diferencia: S/ ' + (c.diferencia_vendedora || 0).toFixed(2)) +
                        '</span></div>' +
                        '<div class="cierre-detalle">Conteo de la vendedora: S/ ' + (c.conteo_vendedora || 0).toFixed(2) + ' | Abrió con: S/ ' + (c.efectivo_inicial || 0).toFixed(2) + '</div>' +
                        '</div>';
                }).join('');
            });
        }

        function abrirModal(id) {
            fetch('/api/admin/cierre/' + id).then(r => r.json()).then(c => {
                cajaActual = c;
                const fecha = new Date(c.fecha).toLocaleDateString('es-PE');
                document.getElementById('modal-info').innerHTML =
                    '<div class="row"><span>Tienda:</span><b>' + (c.tiendas?.nombre || '—') + '</b></div>' +
                    '<div class="row"><span>Fecha:</span><b>' + fecha + '</b></div>' +
                    '<div class="row"><span>Efectivo inicial:</span><b>S/ ' + (c.efectivo_inicial || 0).toFixed(2) + '</b></div>' +
                    '<div class="row"><span>Ventas en efectivo:</span><b>S/ ' + (c.ventas_efectivo || 0).toFixed(2) + '</b></div>' +
                    '<div class="row"><span>Gastos:</span><b>S/ ' + (c.gastos || 0).toFixed(2) + '</b></div>' +
                    '<div class="row"><span>Efectivo esperado:</span><b>S/ ' + (c.efectivo_esperado || 0).toFixed(2) + '</b></div>' +
                    '<div class="row"><span>Contado por la vendedora:</span><b>S/ ' + (c.conteo_vendedora || 0).toFixed(2) + '</b></div>';
                document.getElementById('modal').classList.add('activo');
            });
        }

        function cerrarModal() {
            document.getElementById('modal').classList.remove('activo');
            document.getElementById('conteo_admin').value = '';
            document.getElementById('obs_admin').value = '';
            cajaActual = null;
        }

        function confirmarVerificacion() {
            const conteo = parseFloat(document.getElementById('conteo_admin').value);
            if (isNaN(conteo) || conteo < 0) return alert('Ingresa un monto válido');
            if (!confirm('¿Confirmas tu conteo de S/ ' + conteo.toFixed(2) + '?')) return;

            const obs = document.getElementById('obs_admin').value;
            fetch('/api/admin/verificar-cierre/' + cajaActual.id, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ conteo_admin: conteo, observaciones: obs })
            }).then(r => r.json()).then(data => {
                if (data.error) return alert(data.error);
                let msg = 'Cierre verificado.\n\n';
                msg += 'Conteo vendedora: S/ ' + data.conteo_vendedora.toFixed(2) + '\n';
                msg += 'Tu conteo: S/ ' + data.conteo_admin.toFixed(2) + '\n';
                msg += 'Esperado: S/ ' + data.efectivo_esperado.toFixed(2) + '\n\n';
                if (data.estado === 'verificada') msg += '✅ CAJA VERIFICADA SIN DIFERENCIAS';
                else msg += '🚨 ATENCIÓN: Hay diferencias. Investigar.';
                alert(msg);
                cerrarModal();
                cargarPendientes();
            });
        }

        cargarPendientes();
    </script>
</body>
</html>
