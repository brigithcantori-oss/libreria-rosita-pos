<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Librería Rosita</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { min-height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); width: 100%; max-width: 400px; }
        .logo { text-align: center; font-size: 48px; margin-bottom: 16px; }
        h1 { text-align: center; color: #333; margin-bottom: 8px; font-size: 24px; }
        .sub { text-align: center; color: #888; margin-bottom: 32px; font-size: 14px; }
        label { display: block; color: #555; font-size: 14px; margin-bottom: 6px; font-weight: 600; }
        input { width: 100%; padding: 14px 16px; font-size: 16px; border: 2px solid #e0e0e0; border-radius: 10px; margin-bottom: 16px; }
        input:focus { outline: none; border-color: #667eea; }
        button { width: 100%; padding: 16px; font-size: 16px; font-weight: bold; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 10px; cursor: pointer; }
        button:hover { opacity: 0.95; }
        #error { background: #ffebee; color: #c62828; padding: 12px; border-radius: 8px; margin-bottom: 16px; display: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">📚</div>
        <h1>Librería Rosita</h1>
        <p class="sub">Sistema de ventas y control</p>
        <div id="error"></div>
        <label>Usuario</label>
        <input type="text" id="username" autocomplete="username" autofocus>
        <label>Contraseña</label>
        <input type="password" id="password" autocomplete="current-password">
        <button onclick="entrar()">Ingresar</button>
    </div>

    <script>
        document.getElementById('password').addEventListener('keypress', e => {
            if (e.key === 'Enter') entrar();
        });

        function entrar() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const err = document.getElementById('error');
            err.style.display = 'none';

            fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, password: p })
            })
            .then(r => r.json())
            .then(data => {
                if (data.error) {
                    err.textContent = data.error;
                    err.style.display = 'block';
                    return;
                }
                window.location.href = '/';
            });
        }
    </script>
</body>
</html>
